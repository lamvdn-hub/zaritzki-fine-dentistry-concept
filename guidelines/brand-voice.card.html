<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:26px;background:var(--surface-page);font-family:var(--font-sans);display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col h4{font-family:var(--font-sans);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin:0 0 12px}
.do h4{color:var(--success)}.dont h4{color:var(--danger)}
.line{font-size:14px;line-height:1.5;padding:8px 12px;border-radius:var(--radius-sm);margin-bottom:8px}
.do .line{background:#EEF0E2;color:#3F471F}
.dont .line{background:#F3DDD7;color:#7A2C22;text-decoration:line-through;text-decoration-color:rgba(122,44,34,.4)}</style></head>
<body>
<div class="col do"><h4>We say</h4>
<div class="line">"A calmer kind of dental visit."</div>
<div class="line">"We set aside generous time for every appointment."</div>
<div class="line">"Care that's considered, never rushed."</div>
</div>
<div class="col dont"><h4>We don't</h4>
<div class="line">"BEST dentist in Berlin!!!"</div>
<div class="line">"Book NOW — limited slots 🦷✨"</div>
<div class="line">"Painless, affordable, world-class results"</div>
</div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:30px;background:var(--surface-page)}
.row{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--border-soft);padding:10px 0}
.row:last-child{border-bottom:none}
.spec{font-family:var(--font-display);color:var(--text-strong);line-height:1.05;letter-spacing:-.01em}
.tag{font-family:var(--font-sans);font-size:11px;color:var(--text-subtle);letter-spacing:.04em;white-space:nowrap;margin-left:auto}</style></head>
<body>
<div class="row"><div class="spec" style="font-size:64px;font-weight:400">Fine dentistry</div><div class="tag">Display XL · 64 / 400</div></div>
<div class="row"><div class="spec" style="font-size:48px;font-weight:400">A calmer visit</div><div class="tag">Display LG · 48 / 400</div></div>
<div class="row"><div class="spec" style="font-size:36px;font-weight:500">Considered care</div><div class="tag">Display MD · 36 / 500</div></div>
<div class="row"><div class="spec" style="font-size:28px;font-style:italic;font-weight:400">Berlin, since 2004</div><div class="tag">Display SM · 28 / 400 italic</div></div>
</body></html>

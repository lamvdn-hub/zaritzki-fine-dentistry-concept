<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.sw{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-soft)}
.chip{height:70px}.meta{padding:7px 8px;background:var(--cream)}
.name{font-size:12px;font-weight:700;color:var(--text-strong)}.hex{font-size:11px;color:var(--text-subtle)}</style></head>
<body><div class="strip">
<div class="sw"><div class="chip" style="background:var(--cream)"></div><div class="meta"><div class="name">Cream</div><div class="hex">#FBF8F1</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ivory)"></div><div class="meta"><div class="name">Ivory</div><div class="hex">#F5F0E6</div></div></div>
<div class="sw"><div class="chip" style="background:var(--parchment)"></div><div class="meta"><div class="name">Parchment</div><div class="hex">#EFE7D6</div></div></div>
<div class="sw"><div class="chip" style="background:var(--stone)"></div><div class="meta"><div class="name">Stone</div><div class="hex">#E0D5C0</div></div></div>
<div class="sw"><div class="chip" style="background:var(--sand)"></div><div class="meta"><div class="name">Sand</div><div class="hex">#C7B695</div></div></div>
<div class="sw"><div class="chip" style="background:var(--clay)"></div><div class="meta"><div class="name">Clay</div><div class="hex">#9A8663</div></div></div>
</div></body></html>

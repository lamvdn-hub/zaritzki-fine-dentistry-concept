<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sw{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-soft)}
.chip{height:78px}.meta{padding:8px 10px;background:var(--cream)}
.name{font-size:13px;font-weight:700;color:var(--text-strong)}.hex{font-size:12px;color:var(--text-subtle)}</style></head>
<body><div class="strip">
<div class="sw"><div class="chip" style="background:var(--espresso)"></div><div class="meta"><div class="name">Espresso</div><div class="hex">#241A12 · dark ground</div></div></div>
<div class="sw"><div class="chip" style="background:var(--cocoa)"></div><div class="meta"><div class="name">Cocoa</div><div class="hex">#3A2A1D · dark surface</div></div></div>
<div class="sw"><div class="chip" style="background:var(--walnut)"></div><div class="meta"><div class="name">Walnut</div><div class="hex">#5C4128</div></div></div>
<div class="sw"><div class="chip" style="background:var(--umber)"></div><div class="meta"><div class="name">Umber</div><div class="hex">#7A5638 · muted text</div></div></div>
</div></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--surface-page)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ph{position:relative;aspect-ratio:3/4;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-soft)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cap{font-family:var(--font-sans);font-size:12px;color:var(--text-subtle);margin-top:14px;line-height:1.5}
.cap b{color:var(--text-strong);font-weight:600}</style></head>
<body>
<div class="grid">
<div class="ph"><img src="../assets/images/treatment-room.webp" alt=""></div>
<div class="ph"><img src="../assets/images/interior-lounge.webp" alt=""></div>
<div class="ph"><img src="../assets/images/library-lounge.webp" alt=""></div>
<div class="ph"><img src="../assets/images/powder-room.webp" alt=""></div>
</div>
<div class="cap"><b>Warm, low-lit, architectural.</b> Real interiors over clinical stock — espresso wood, brass, lamplight, deep shadow. Photography skews warm; avoid cool blue-white "dental office" imagery entirely.</div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:26px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;align-items:center;gap:16px;padding:4px 0}
.bar{height:16px;background:var(--gold);border-radius:2px}
.name{width:74px;font-size:13px;font-weight:600;color:var(--text-strong)}
.val{font-size:12px;color:var(--text-subtle)}</style></head>
<body>
<div class="row"><div class="name">space-1</div><div class="bar" style="width:4px"></div><div class="val">4px</div></div>
<div class="row"><div class="name">space-2</div><div class="bar" style="width:8px"></div><div class="val">8px</div></div>
<div class="row"><div class="name">space-3</div><div class="bar" style="width:12px"></div><div class="val">12px</div></div>
<div class="row"><div class="name">space-4</div><div class="bar" style="width:16px"></div><div class="val">16px</div></div>
<div class="row"><div class="name">space-5</div><div class="bar" style="width:24px"></div><div class="val">24px</div></div>
<div class="row"><div class="name">space-6</div><div class="bar" style="width:32px"></div><div class="val">32px</div></div>
<div class="row"><div class="name">space-7</div><div class="bar" style="width:48px"></div><div class="val">48px</div></div>
<div class="row"><div class="name">space-8</div><div class="bar" style="width:64px"></div><div class="val">64px</div></div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sw{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-soft)}
.chip{height:78px}.meta{padding:8px 10px;background:var(--cream)}
.name{font-size:13px;font-weight:700;color:var(--text-strong)}.hex{font-size:12px;color:var(--text-subtle);letter-spacing:.03em}</style></head>
<body><div class="strip">
<div class="sw"><div class="chip" style="background:var(--gold-light)"></div><div class="meta"><div class="name">Gold Light</div><div class="hex">#CDA75E · hover</div></div></div>
<div class="sw"><div class="chip" style="background:var(--gold)"></div><div class="meta"><div class="name">Gold</div><div class="hex">#B58A3E · --brand</div></div></div>
<div class="sw"><div class="chip" style="background:var(--gold-deep)"></div><div class="meta"><div class="name">Gold Deep</div><div class="hex">#8F6C2C · text/press</div></div></div>
<div class="sw"><div class="chip" style="background:var(--gold-wash)"></div><div class="meta"><div class="name">Gold Wash</div><div class="hex">#EDE3CC · tint fill</div></div></div>
</div></body></html>

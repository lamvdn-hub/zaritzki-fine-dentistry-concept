<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sw{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-soft)}
.chip{height:74px}.meta{padding:7px 9px;background:var(--cream)}
.name{font-size:12px;font-weight:700;color:var(--text-strong)}.hex{font-size:11px;color:var(--text-subtle)}</style></head>
<body><div class="strip">
<div class="sw"><div class="chip" style="background:var(--cognac)"></div><div class="meta"><div class="name">Cognac</div><div class="hex">#A45A2A</div></div></div>
<div class="sw"><div class="chip" style="background:var(--cognac-deep)"></div><div class="meta"><div class="name">Cognac Deep</div><div class="hex">#7E4320</div></div></div>
<div class="sw"><div class="chip" style="background:var(--midnight)"></div><div class="meta"><div class="name">Midnight</div><div class="hex">#27394F</div></div></div>
<div class="sw"><div class="chip" style="background:var(--midnight-deep)"></div><div class="meta"><div class="name">Midnight Deep</div><div class="hex">#1A2635</div></div></div>
<div class="sw"><div class="chip" style="background:var(--amber)"></div><div class="meta"><div class="name">Amber</div><div class="hex">#C4611C · sparse</div></div></div>
</div></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sw{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-soft)}
.chip{height:64px}.meta{padding:8px 10px;background:var(--cream)}
.name{font-size:13px;font-weight:700;color:var(--text-strong)}.hex{font-size:12px;color:var(--text-subtle)}</style></head>
<body><div class="strip">
<div class="sw"><div class="chip" style="background:var(--success)"></div><div class="meta"><div class="name">Success</div><div class="hex">#6E7A47 · olive</div></div></div>
<div class="sw"><div class="chip" style="background:var(--warning)"></div><div class="meta"><div class="name">Warning</div><div class="hex">#C4611C · amber</div></div></div>
<div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="meta"><div class="name">Danger</div><div class="hex">#9E3B2E · brick</div></div></div>
<div class="sw"><div class="chip" style="background:var(--info)"></div><div class="meta"><div class="name">Info</div><div class="hex">#27394F · midnight</div></div></div>
</div></body></html>

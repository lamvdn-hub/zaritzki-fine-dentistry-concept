<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:28px;background:var(--surface-page);font-family:var(--font-sans);display:flex;gap:40px;flex-wrap:wrap}
.group{display:flex;gap:18px}
.item{text-align:center}
.box{width:64px;height:64px;background:var(--cream);border:1px solid var(--border-soft)}
.lbl{font-size:11px;color:var(--text-subtle);margin-top:8px}
.sbox{width:80px;height:64px;background:var(--cream);border-radius:8px}</style></head>
<body>
<div>
<div class="group">
<div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lbl">sm · 4</div></div>
<div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl">md · 6</div></div>
<div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl">lg · 10</div></div>
<div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lbl">xl · 16</div></div>
</div>
</div>
<div>
<div class="group">
<div class="item"><div class="sbox" style="box-shadow:var(--shadow-sm)"></div><div class="lbl">shadow-sm</div></div>
<div class="item"><div class="sbox" style="box-shadow:var(--shadow-md)"></div><div class="lbl">shadow-md</div></div>
<div class="item"><div class="sbox" style="box-shadow:var(--shadow-lg)"></div><div class="lbl">shadow-lg</div></div>
<div class="item"><div class="sbox" style="box-shadow:var(--shadow-gold)"></div><div class="lbl">gold glow</div></div>
</div>
</div>
</body></html>

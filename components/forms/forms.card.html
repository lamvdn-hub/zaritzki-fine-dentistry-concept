<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 28px; background: var(--surface-page); }
  .wrap { display: flex; flex-direction: column; gap: 24px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: end; }
  .lbl { font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 2px; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, IconButton, Input, Select, Checkbox, Radio, Switch } = window.ZaritzkiFineDentistryDesignSystem_dfee56;
const Cal = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>);
const Mail = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>);
const Phone = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>);
function Demo(){
  return (<>
    <div><div className="lbl">Buttons</div><div className="row">
      <Button variant="primary">Book a consultation</Button>
      <Button variant="secondary">Our services</Button>
      <Button variant="ghost" iconLeft={<Phone/>}>Call us</Button>
      <Button variant="link">Learn more</Button>
      <Button variant="primary" disabled>Booked</Button>
    </div></div>
    <div className="row">
      <div><div className="lbl">Sizes</div><div className="row">
        <Button size="sm">Small</Button><Button size="md">Medium</Button><Button size="lg" iconLeft={<Cal/>}>Large</Button>
      </div></div>
      <div><div className="lbl">Icon</div><div className="row">
        <IconButton label="Call" variant="ghost"><Phone/></IconButton>
        <IconButton label="Email" variant="outline"><Mail/></IconButton>
        <IconButton label="Book" variant="solid"><Cal/></IconButton>
      </div></div>
    </div>
    <div className="grid">
      <Input label="Full name" placeholder="e.g. Anna Berger" />
      <Input label="Email" iconLeft={<Mail/>} placeholder="you@email.com" />
      <Select label="Treatment" options={['Cleaning & prophylaxis','Whitening','Implant consultation']} />
      <Input label="Phone" error="Please enter a valid number" defaultValue="030 1" />
    </div>
    <div className="row" style={{gap:'28px'}}>
      <Checkbox label="Send me reminders" defaultChecked />
      <Radio name="t" label="Morning" defaultChecked /><Radio name="t" label="Afternoon" />
      <Switch label="SMS reminders" defaultChecked />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
